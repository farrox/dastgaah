<text x="70" y="514" font-size="10.5" fill="#475569">Steps: 13/12 (~139¢) + Augmented 2nd (~269¢) + Limma (~90¢) = 4/3 · Measured 12-master consensus: Reᵏ = 138.7¢, Mi = 402.3¢</text>
