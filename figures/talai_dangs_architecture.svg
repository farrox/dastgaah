<text x="140.0" y="162" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">1/1</text>
<text x="140.0" y="174" font-size="10" font-weight="600" class="mono" fill="#0F172A" text-anchor="middle">0¢</text>
<text x="140.0" y="204" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">Tonic (Do)</text>
