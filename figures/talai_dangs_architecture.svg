<text x="70" y="656" font-size="10.5" fill="#475569">Steps: 9/8 (203.9¢) + 256/243 (90.2¢) + 9/8 (203.9¢) = 4/3 · Lower dāng of Bayāt-e Esfahān; couples with Upper Chahārgāh at 5th</text>
