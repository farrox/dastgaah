<text x="70" y="920" font-size="11.5" font-weight="700" fill="#1E3A8A">• Dual Historical Variant Ratios [in brackets]:</text>
<text x="90" y="939" font-size="11" fill="#334155"><tspan font-weight="600">Neutral 2nd:</tspan> Al-Fārābī superparticular 13/12 (138.6¢) vs Pythagorean limma 256/243 (90.2¢) in old Qajar lineages.</text>
<text x="90" y="956" font-size="11" fill="#334155"><tspan font-weight="600">Minor 3rd:</tspan> Marāghī Pythagorean 32/27 (294.1¢) vs Just 6/5 (315.6¢) · <tspan font-weight="600">Major 3rd:</tspan> Marāghī 81/64 (407.8¢) vs Urmawī 5/4 (386.3¢).</text>
<text x="70" y="982" font-size="11.5" font-weight="700" fill="#BE123C">• Why is there no Mi-koron (Miᵏ) in any Do-dāng?</text>
<text x="90" y="999" font-size="11" fill="#475569">None of the 4 elemental Do-dāngs generate Miᵏ. The physical neck fret at ~343¢ is born ONLY when a dāng is rooted on Re (9/8 &#215; 13/12 = 117/96 = 342.5¢, or ancient Zalzal 27/22 = 354.5¢)!</text>
</svg>