<text x="70" y="372" font-size="10.5" fill="#475569">Steps: 9/8 (203.9¢) + 9/8 (203.9¢) + 256/243 (90.2¢) = 4/3 · Measured 13-master consensus: Re = 201.5¢, Mi = 400.8¢</text>
<rect x="50" y="400" width="1180" height="128" class="ruler-bg"/>
