<text x="418.3" y="174" font-size="10" font-weight="600" class="mono" fill="#DC2626" text-anchor="middle">+138.6¢</text>
<text x="418.3" y="204" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">Reᵏ (Fārābī / Qajar Limma)</text>
<line x1="730.6" y1="176" x2="730.6" y2="188" stroke="#2563EB" stroke-width="1.8"/>
<circle cx="730.6" cy="182" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="730.6" y="162" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">32/27 [6/5]</text>
<text x="730.6" y="174" font-size="10" font-weight="600" class="mono" fill="#2563EB" text-anchor="middle">+294.1¢</text>
<text x="730.6" y="204" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">Mi♭ (Pythagorean / Just)</text>
<line x1="1140.0" y1="176" x2="1140.0" y2="188" stroke="#16A34A" stroke-width="1.8"/>
<circle cx="1140.0" cy="182" r="6" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
