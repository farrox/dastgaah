<text x="55" y="65" font-size="24" class="title">Dariush Tala'i's Theory of Dāngs &amp; Setār Neck Architecture</text>
<text x="55" y="90" font-size="13" class="subtitle">The 4 Elemental Tetrachords (Dāngs), Pure Mathematical Ratios, Historical Variants, and String 1 (Do) Superimposition</text>
<rect x="50" y="116" width="1180" height="128" class="ruler-bg"/>
<text x="70" y="139" font-size="13" font-weight="700" fill="#0F172A">1. Dāng-e Shūr (Root of Shūr, Dashti, Navā, Abū’atā, Afshārī)</text>
<text x="1210" y="139" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Interval Pattern: Neutral 2nd (N) + Neutral 2nd (N) + Whole Tone (T)</text>
<line x1="140" y1="182" x2="1140" y2="182" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
