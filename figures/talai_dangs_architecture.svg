<text x="1140.0" y="174" font-size="10" font-weight="600" class="mono" fill="#16A34A" text-anchor="middle">+498.0¢</text>
<text x="1140.0" y="204" font-size="11" font-weight="600" fill="#1E293B" text-anchor="middle">Pure 4th (Fa)</text>
<text x="70" y="230" font-size="10.5" fill="#475569">Steps: 13/12 (138.6¢) + 155.5¢ + 9/8 (203.9¢) = 4/3 (498.0¢) · Historical: Limma 256/243 (90.2¢) in early Qajar radifs</text>
<rect x="50" y="258" width="1180" height="128" class="ruler-bg"/>
<text x="70" y="281" font-size="13" font-weight="700" fill="#0F172A">2. Dāng-e Māhūr (Root of Māhūr &amp; Rāst-Panjgāh)</text>
<text x="1210" y="281" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">Interval Pattern: Whole Tone (T) + Whole Tone (T) + Semitone (S)</text>
